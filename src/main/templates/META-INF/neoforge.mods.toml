modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
An experiment in placing Create train track at arbitrary end angles, rather than
the 45 and 90 degree steps Create's own track placement tool allows.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    reason="The curve geometry and track models are Create's."
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Create pulls these in itself, but we render through them directly, so load after both.
[[dependencies.${mod_id}]]
    modId="ponder"
    type="required"
    versionRange="[1.0.85,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="flywheel"
    type="required"
    versionRange="[1.0.0,2.0)"
    ordering="AFTER"
    side="CLIENT"
